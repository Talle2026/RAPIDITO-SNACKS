<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rapidito Snacks - Menú Digital PWA</title>

  <!-- Metadatos PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d9381e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-rapidito">

  <!-- LAYOUT PRINCIPAL -->
  <div class="app-layout">

    <!-- CONTENIDO DE LA APP -->
    <div class="main-content">

      <!-- ENCABEZADO CON LOGO Y MARCA -->
      <header class="app-header">
        <div class="brand-container">
          <div class="brand-logo-wrap">
            <img src="logo-rapidito.png" alt="" class="brand-logo-img" onerror="this.style.display='none'">
          </div>
          <div class="brand-titles">
            <h1 class="brand-title">RAPIDITO</h1>
            <span class="brand-subtitle">SNACKS • DELICIAS RÁPIDAS</span>
          </div>
        </div>
        <div class="status-badge">
          <span class="status-dot"></span> Abierto
        </div>
      </header>

      <!-- BANNER DE PROMOCIÓN DESTACADA -->
      <section class="hero-promo">
        <div class="promo-card">
          <span class="promo-badge">🔥 Para Compartir</span>
          <div class="promo-content">
            <div class="promo-info">
              <h2>3 KILOS DE ALITAS</h2>
              <p>3 kilos de alitas jugosas con salsa a elegir (BBQ, Mango Habanero, Búfalo, Tamarindo, Hot).</p>
              <div class="promo-footer">
                <span class="promo-price">$500.00</span>
                <button class="btn-add-promo" onclick="addToCart(101)">+ Agregar</button>
              </div>
            </div>
            <div class="promo-thumb">
              <img src="https://images.unsplash.com/photo-1567620832903-9fc6debc209f?w=400" alt="3 Kilos de Alitas">
            </div>
          </div>
        </div>
      </section>

      <!-- BARRA DE BÚSQUEDA -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Buscar hamburguesa, alitas, postres...">
      </div>

      <!-- BOTONES DE CATEGORÍAS SEGÚN TU LOGO -->
      <nav class="category-scroll" id="categories-container">
        <button class="cat-btn active" data-category="todos">
          <span class="cat-emoji">🔥</span>
          <span class="cat-text">Todo</span>
        </button>
        <button class="cat-btn" data-category="hamburguesas">
          <span class="cat-emoji">🍔</span>
          <span class="cat-text">Hamburguesas</span>
        </button>
        <button class="cat-btn" data-category="hotdogs">
          <span class="cat-emoji">🌭</span>
          <span class="cat-text">Hotdogs</span>
        </button>
        <button class="cat-btn" data-category="alitas">
          <span class="cat-emoji">🍗</span>
          <span class="cat-text">Alitas</span>
        </button>
        <button class="cat-btn" data-category="postres">
          <span class="cat-emoji">🍰</span>
          <span class="cat-text">Postres</span>
        </button>
        <button class="cat-btn" data-category="bebidas">
          <span class="cat-emoji">🥤</span>
          <span class="cat-text">Bebidas</span>
        </button>
        <button class="cat-btn" data-category="snacks">
          <span class="cat-emoji">🍟</span>
          <span class="cat-text">Snacks</span>
        </button>
      </nav>

      <!-- LISTADO DE PRODUCTOS -->
      <section class="products-section">
        <div class="section-title-wrap">
          <h2 id="category-title">Menú Principal</h2>
        </div>

        <div class="products-grid" id="products-grid">
          <!-- Los productos se renderizan dinámicamente desde app.js -->
        </div>
      </section>

    </div>

    <!-- PANEL DEL CARRITO / PEDIDO -->
    <aside class="cart-sidebar" id="cart-sidebar">
      <div class="cart-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <h3>🛒 Tu Pedido</h3>
          <span class="items-count" id="cart-count">0</span>
        </div>
        <!-- BOTÓN PARA VOLVER AL MENÚ EN MÓVIL -->
        <button class="btn-close-cart" onclick="toggleMobileCart()">← Volver al menú</button>
      </div>

      <div class="cart-list" id="cart-items-list">
        <div class="empty-state">
          <span>🍽️</span>
          <p>Aún no has agregado delicias a tu pedido.</p>
        </div>
      </div>

      <div class="cart-footer">
        <div class="total-row">
          <span>Total:</span>
          <strong id="total-val">$0.00</strong>
        </div>

        <!-- OPCIONES DE ENTREGA -->
        <div class="delivery-options">
          <label>
            <input type="radio" name="delivery-type" value="sucursal" checked onchange="toggleAddressInput()">
            <span>Para recoger</span>
          </label>
          <label>
            <input type="radio" name="delivery-type" value="domicilio" onchange="toggleAddressInput()">
            <span>Domicilio</span>
          </label>
        </div>

        <!-- CAMPO Y BOTÓN DE UBICACIÓN (DESPLEGABLE AL ELEGIR DOMICILIO) -->
        <div id="delivery-address-container" style="display: none; margin-top: 10px;">
          <input type="text" id="client-address" placeholder="Calle, número, colonia..." style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 0.85rem; margin-bottom: 8px; box-sizing: border-box;">
          <button type="button" id="btn-gps" onclick="obtenerUbicacionGPS()" style="width: 100%; padding: 8px; background: #2a2a2a; color: #ffb703; border: 1px solid #ffb703; border-radius: 6px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;">
            📍 Usar mi ubicación actual (GPS)
          </button>
          <small id="gps-status" style="display: block; font-size: 0.75rem; color: #aaa; margin-top: 4px; text-align: center;"></small>
        </div>

        <button class="btn-send-whatsapp" onclick="sendOrderWhatsApp()" style="margin-top: 12px;">
          📱 Enviar Pedido por WhatsApp
        </button>
      </div>
    </aside>

  </div>

  <!-- NAVEGACIÓN INFERIOR PARA MÓVIL -->
  <nav class="mobile-bottom-nav">
    <button class="nav-btn active">
      <span>🏠</span>
      <small>Menú</small>
    </button>
    <button class="nav-btn" onclick="toggleMobileCart()">
      <div class="cart-icon-badge">
        <span>🛒</span>
        <span class="badge" id="mobile-cart-badge">0</span>
      </div>
      <small>Pedido</small>
    </button>
  </nav>

  <script src="app.js?v=3.3"></script>
</body>
</html>
