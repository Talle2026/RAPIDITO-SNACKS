<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rapidito Snacks - Menú Digital PWA</title>

  <!-- Metadatos PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d9381e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-rapidito">

  <!-- LAYOUT PRINCIPAL -->
  <div class="app-layout">

    <!-- CONTENIDO DE LA APP -->
    <div class="main-content">

      <!-- ENCABEZADO CON LOGO Y MARCA -->
      <header class="app-header">
        <div class="brand-container">
          <div class="brand-logo-wrap">
            <img src="logo-rapidito.png" alt="" class="brand-logo-img" onerror="this.style.display='none'">
          </div>
          <div class="brand-titles">
            <h1 class="brand-title">RAPIDITO</h1>
            <span class="brand-subtitle">SNACKS • DELICIAS RÁPIDAS</span>
          </div>
        </div>
        <div class="status-badge">
          <span class="status-dot"></span> Abierto
        </div>
      </header>

      <!-- BOTÓN DIRECTO A LA ESTACIÓN DEL TRAGO -->
      <div style="text-align: center; margin: 12px 15px 5px 15px;">
        <a href="tragos.html" style="background: #1b263b; color: #ffffff; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.95rem; border: 2px solid #ffb703; display: block; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center;">
          🍹 IR A LA ESTACIÓN DEL TRAGO (BEBIDAS) ➔
        </a>
      </div>

      <!-- BANNER DE PROMOCIÓN DESTACADA -->
      <section class="hero-promo">
        <div class="promo-card">
          <span class="promo-badge">🔥 Para Compartir</span>
          <div class="promo-content">
            <div class="promo-info">
              <h2>3 KILOS DE ALITAS</h2>
              <p>3 kilos de alitas jugosas con salsa a elegir (BBQ, Mango Habanero, Búfalo, Tamarindo, Hot, Original).</p>
              <div class="promo-footer">
                <span class="promo-price">$500.00</span>
                <button class="btn-add-promo" onclick="addToCart(101)">+ Agregar</button>
              </div>
            </div>
            <div class="promo-thumb">
              <img src="https://images.unsplash.com/photo-1567620832903-9fc6debc209f?w=400" alt="3 Kilos de Alitas">
            </div>
          </div>
        </div>
      </section>

      <!-- BARRA DE BÚSQUEDA -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Buscar hamburguesa, alitas, postres...">
      </div>

      <!-- BOTONES DE CATEGORÍAS -->
      <nav class="category-scroll" id="categories-container">
        <button class="cat-btn active" data-category="todos">
          <span class="cat-emoji">🔥</span>
          <span class="cat-text">Todo</span>
